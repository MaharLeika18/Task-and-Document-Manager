{% extends "base.html" %}

{% block title %}Calendar{% endblock %}

{% block content %}
<h1>Project Calendar</h1>

<div class="calendar-container">
    <div class="calendar-header">
        <button id="prev-month">&lt;</button>
        <h2 id="calendar-title" class="calendar-title"></h2>
        <button id="next-month">&gt;</button>
    </div>

    <div class="calendar-grid">
        <div class="day-header">Sun</div>
        <div class="day-header">Mon</div>
        <div class="day-header">Tue</div>
        <div class="day-header">Wed</div>
        <div class="day-header">Thu</div>
        <div class="day-header">Fri</div>
        <div class="day-header">Sat</div>
    </div>

    <div id="calendar-days" class="calendar-days">
        <!-- Calendar days will be populated by JavaScript -->
    </div>
</div>

<div class="upcoming-events">
    <h2>Upcoming Events</h2>
    <div id="events-list">
        <!-- Events will be populated here -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Simple calendar implementation
    const calendarDays = document.getElementById('calendar-days');
    const calendarTitle = document.getElementById('calendar-title');
    const prevButton = document.getElementById('prev-month');
    const nextButton = document.getElementById('next-month');
    const eventsList = document.getElementById('events-list');

    let currentDate = new Date();
    let calendarEvents = [];

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        calendarTitle.textContent = new Date(year, month).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long'
        });

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - firstDay.getDay());

        calendarDays.innerHTML = '';

        for (let i = 0; i < 42; i++) {
            const day = new Date(startDate);
            day.setDate(startDate.getDate() + i);

            const dayElement = document.createElement('div');
            dayElement.classList.add('calendar-day');

            if (day.getMonth() !== month) {
                dayElement.classList.add('other-month');
            }

            if (day.toDateString() === new Date().toDateString()) {
                dayElement.classList.add('today');
            }

            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.textContent = day.getDate();
            dayElement.appendChild(dayNumber);

            const dateKey = day.toISOString().split('T')[0];
            const dayEvents = calendarEvents.filter(event => event.start_date === dateKey || event.due_date === dateKey);
            if (dayEvents.length) {
                if (dayEvents.some(event => event.type === 'task' && event.status === 'done')) {
                    dayElement.classList.add('completed');
                }

                const eventContainer = document.createElement('div');
                eventContainer.className = 'calendar-day-events';
                dayEvents.slice(0, 2).forEach(event => {
                    const pill = document.createElement('span');
                    pill.className = `event-pill ${event.type === 'project' ? 'project' : event.status === 'done' ? 'completed' : ''}`;
                    pill.textContent = event.title;
                    eventContainer.appendChild(pill);
                });
                if (dayEvents.length > 2) {
                    const more = document.createElement('span');
                    more.className = 'event-pill more';
                    more.textContent = `+${dayEvents.length - 2} more`;
                    eventContainer.appendChild(more);
                }
                dayElement.appendChild(eventContainer);
            }

            calendarDays.appendChild(dayElement);
        }
    }

    function renderUpcomingEvents() {
        eventsList.innerHTML = '';
        const upcoming = calendarEvents
            .filter(event => {
                const dateString = event.start_date || event.due_date;
                return new Date(dateString) >= new Date();
            })
            .sort((a, b) => new Date((a.start_date || a.due_date)) - new Date((b.start_date || b.due_date)));

        if (!upcoming.length) {
            eventsList.innerHTML = '<p>No upcoming events at the moment.</p>';
            return;
        }

        upcoming.slice(0, 10).forEach(event => {
            const card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
                <div>
                    <div class="event-name">${event.title}</div>
                    <div class="event-date">${event.start_date || event.due_date} • ${event.type === 'project' ? 'Project' : 'Task'}${event.type === 'task' ? ` • ${event.project}` : ''}</div>
                </div>
                ${event.link ? `<a href="${event.link}" target="_blank" class="event-link">Open</a>` : ''}
            `;
            eventsList.appendChild(card);
        });
    }

    async function loadCalendarEvents() {
        try {
            const response = await fetch('/calendar/events');
            const data = await response.json();
            if (data.success) {
                calendarEvents = data.events || [];
            }
        } catch (error) {
            console.error('Error loading calendar events:', error);
        }
    }

    async function refreshCalendar() {
        await loadCalendarEvents();
        renderCalendar();
        renderUpcomingEvents();
    }

    prevButton.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });

    nextButton.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });

    refreshCalendar();
</script>
{% endblock %}
