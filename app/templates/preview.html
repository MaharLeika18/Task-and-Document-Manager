{% extends "base.html" %}

{% block title %}Preview - {{ file_name }}{% endblock %}

{% block content %}
<div class="document-viewer-page">
    <div class="document-header">
        <div class="document-title">
            <h2>{{ file_name }}</h2>
        </div>
        <div class="document-controls">
            <a href="/files/download/{{ file_id }}" class="doc-btn" title="Download">⬇️</a>
            <a href="{{ return_url or url_for('files.files') }}" class="doc-btn" title="Back to Files">✕</a>
        </div>
    </div>
    
    <div class="document-content">
        <iframe src="{{ preview_url }}" class="document-iframe" title="Document Preview"></iframe>
    </div>
</div>
{% endblock %}
