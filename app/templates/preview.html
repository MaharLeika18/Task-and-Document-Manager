{% extends "base.html" %}

{% block title %}Preview - {{ file_name }}{% endblock %}

{% block content %}
<div class="document-preview-container">
    <div class="preview-toolbar">
        <h2>{{ file_name }}</h2>
        <a href="javascript:history.back()" class="btn-secondary">Back</a>
    </div>
    
    <div class="preview-wrapper">
        <iframe src="{{ preview_url }}" class="document-viewer" title="Document Preview"></iframe>
    </div>
</div>

<style>
    .document-preview-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
    }
    
    .preview-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
    }
    
    .preview-toolbar h2 {
        margin: 0;
        font-size: 1.25rem;
    }
    
    .preview-wrapper {
        flex: 1;
        overflow: hidden;
    }
    
    .document-viewer {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
{% endblock %}
