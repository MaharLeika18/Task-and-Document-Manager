{% extends "base.html" %}

{% block title %}Image - {{ file_name }}{% endblock %}

{% block content %}
<div class="document-viewer-page">
    <div class="document-header">
        <div class="document-title">
            <h2>{{ file_name }}</h2>
        </div>
        <div class="document-controls">
            <button id="zoom-in-btn" class="doc-btn" title="Zoom In (Ctrl++)">🔍+</button>
            <button id="zoom-out-btn" class="doc-btn" title="Zoom Out (Ctrl+-)">🔍-</button>
            <button id="zoom-reset-btn" class="doc-btn" title="Reset Zoom">⊙</button>
            <a href="/files/download/{{ file_id }}" class="doc-btn" title="Download">⬇️</a>
            <a href="/files" class="doc-btn" title="Back to Files">✕</a>
        </div>
    </div>
    
    <div class="document-content image-content">
        {% if web_content_link %}
            <img id="image-display" src="{{ web_content_link }}" alt="{{ file_name }}" class="image-display">
        {% else %}
            <div class="document-placeholder">
                <p>Unable to load image preview</p>
                <a href="/files/download/{{ file_id }}" class="btn-primary">Download Image</a>
            </div>
        {% endif %}
    </div>
</div>

<script>
    const imageDisplay = document.getElementById('image-display');
    const zoomInBtn = document.getElementById('zoom-in-btn');
    const zoomOutBtn = document.getElementById('zoom-out-btn');
    const zoomResetBtn = document.getElementById('zoom-reset-btn');
    
    let currentZoom = 1;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let translate = { x: 0, y: 0 };
    
    if (imageDisplay) {
        function updateZoom() {
            imageDisplay.style.transform = `scale(${currentZoom}) translate(${translate.x}px, ${translate.y}px)`;
        }
        
        function resetZoom() {
            currentZoom = 1;
            translate = { x: 0, y: 0 };
            updateZoom();
        }
        
        zoomInBtn.addEventListener('click', () => {
            currentZoom = Math.min(currentZoom + 0.2, 5);
            updateZoom();
        });
        
        zoomOutBtn.addEventListener('click', () => {
            currentZoom = Math.max(currentZoom - 0.2, 0.2);
            updateZoom();
        });
        
        zoomResetBtn.addEventListener('click', resetZoom);
        
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === '+' || e.key === '=') {
                    e.preventDefault();
                    currentZoom = Math.min(currentZoom + 0.2, 5);
                    updateZoom();
                } else if (e.key === '-') {
                    e.preventDefault();
                    currentZoom = Math.max(currentZoom - 0.2, 0.2);
                    updateZoom();
                } else if (e.key === '0') {
                    e.preventDefault();
                    resetZoom();
                }
            }
        });
        
        imageDisplay.addEventListener('wheel', (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.2 : 0.2;
                currentZoom = Math.max(0.2, Math.min(5, currentZoom + delta));
                updateZoom();
            }
        });
        
        imageDisplay.addEventListener('mousedown', (e) => {
            if (currentZoom > 1) {
                isDragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
            }
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = (e.clientX - dragStart.x) / currentZoom;
                const deltaY = (e.clientY - dragStart.y) / currentZoom;
                translate.x += deltaX;
                translate.y += deltaY;
                dragStart = { x: e.clientX, y: e.clientY };
                updateZoom();
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        imageDisplay.addEventListener('dblclick', () => {
            if (currentZoom === 1) {
                currentZoom = 2;
            } else {
                resetZoom();
            }
            updateZoom();
        });
    }
</script>
{% endblock %}
